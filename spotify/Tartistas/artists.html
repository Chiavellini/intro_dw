<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Spotify • Artistas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="artists.js" defer></script>
  </head>

  <body class="container py-4">
    <h1 class="h3 text-success mb-3">Spotify • Artistas</h1>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-lg-5">
            <div class="input-group">
              <span class="input-group-text">Access Token</span>
              <input
                id="token"
                type="text"
                class="form-control"
                placeholder="Access token (Bearer)"
              />
            </div>
          </div>
          <div class="col-12 col-lg-5">
            <input
              id="search"
              type="text"
              class="form-control"
              placeholder="Buscar artista por nombre"
            />
          </div>
          <div class="col-12 col-lg-2 d-grid">
            <button id="btn-search" class="btn btn-success">Buscar</button>
          </div>
        </div>
      </div>
    </div>
    
    <div id="results" class="row g-3"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
